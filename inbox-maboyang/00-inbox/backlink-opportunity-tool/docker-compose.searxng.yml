services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 30 1 --loglevel warning
    volumes:
      - searxng-redis:/data

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_PUBLIC_BASE_URL:-http://localhost:8080/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env before starting SearXNG}

volumes:
  searxng-redis:
