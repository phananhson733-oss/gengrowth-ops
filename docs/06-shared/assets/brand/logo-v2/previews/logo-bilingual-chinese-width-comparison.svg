<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="720" viewBox="0 0 1680 720">
  <rect width="1680" height="720" fill="#F1F5F9"/>
  <text x="60" y="66" fill="#0F172A" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600">GenGrowth 中文字标占宽对比</text>
  <text x="60" y="102" fill="#64748B" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20">仅调整“进格智能”的横向占宽，其余元素完全不变</text>

  <g transform="translate(40 140)">
    <rect width="500" height="510" rx="18" fill="#FFFFFF"/>
    <text x="28" y="45" fill="#0F172A" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600">A  原版</text>
    <text x="28" y="76" fill="#64748B" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17">中文宽度约为英文的 49%</text>
    <g transform="translate(10 118) scale(.4)">
      <image x="36" y="45" width="330" height="330" href="../logo-mark.png"/>
      <text x="405" y="194" fill="#0F172A" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="104" font-weight="600" letter-spacing="-3">GenGrowth</text>
      <text x="410" y="286" fill="#334155" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="58" font-weight="500" letter-spacing="8">进格智能</text>
      <g fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="8 8" opacity=".55">
        <path d="M409 95V310M921 95V310"/>
      </g>
    </g>
    <text x="250" y="445" text-anchor="middle" fill="#334155" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18">层级明确，但中文显得偏短</text>
  </g>

  <g transform="translate(590 140)">
    <rect width="500" height="510" rx="18" fill="#FFFFFF" stroke="#2B8CF2" stroke-width="3"/>
    <text x="28" y="45" fill="#0F172A" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600">B  适度加宽（推荐）</text>
    <text x="28" y="76" fill="#64748B" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17">中文宽度约为英文的 68%，保持从属关系</text>
    <g transform="translate(10 118) scale(.4)">
      <image x="36" y="45" width="330" height="330" href="../logo-mark.png"/>
      <text x="405" y="194" fill="#0F172A" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="104" font-weight="600" letter-spacing="-3">GenGrowth</text>
      <g fill="#334155" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="58" font-weight="500">
        <text x="488" y="286">进</text>
        <text x="587" y="286">格</text>
        <text x="687" y="286">智</text>
        <text x="785" y="286">能</text>
      </g>
      <g fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="8 8" opacity=".55">
        <path d="M409 95V310M921 95V310"/>
      </g>
    </g>
    <text x="250" y="445" text-anchor="middle" fill="#0F172A" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500">更平衡，也不会抢英文主标</text>
  </g>

  <g transform="translate(1140 140)">
    <rect width="500" height="510" rx="18" fill="#FFFFFF"/>
    <text x="28" y="45" fill="#0F172A" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600">C  与英文两端完全对齐</text>
    <text x="28" y="76" fill="#64748B" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17">中文宽度约为英文的 100%</text>
    <g transform="translate(10 118) scale(.4)">
      <image x="36" y="45" width="330" height="330" href="../logo-mark.png"/>
      <text x="405" y="194" fill="#0F172A" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="104" font-weight="600" letter-spacing="-3">GenGrowth</text>
      <g fill="#334155" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="58" font-weight="500">
        <text x="406" y="286">进</text>
        <text x="559" y="286">格</text>
        <text x="712" y="286">智</text>
        <text x="865" y="286">能</text>
      </g>
      <g fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="8 8" opacity=".55">
        <path d="M409 95V310M921 95V310"/>
      </g>
    </g>
    <text x="250" y="445" text-anchor="middle" fill="#334155" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18">边界整齐，但四字间距明显过散</text>
  </g>

  <text x="840" y="688" text-anchor="middle" fill="#64748B" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17">橙色虚线表示英文 GenGrowth 的可见左右边界</text>
</svg>
