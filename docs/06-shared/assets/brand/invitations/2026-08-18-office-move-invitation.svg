<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1536" height="2048" viewBox="0 0 1536 2048">
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5DDA72"/>
      <stop offset="1" stop-color="#278FF0"/>
    </linearGradient>
    <linearGradient id="softBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5DDA72" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#278FF0" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#16324A" flood-opacity="0.08"/>
    </filter>
    <style><![CDATA[
      .cn { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .ink { fill: #101828; }
      .muted { fill: #526174; }
    ]]></style>
  </defs>

  <rect width="1536" height="2048" fill="#FAF8F3"/>

  <!-- Soft brand decoration -->
  <circle cx="116" cy="110" r="340" fill="url(#softBrand)" opacity="0.82"/>
  <circle cx="1408" cy="1916" r="360" fill="url(#softBrand)" opacity="0.72"/>
  <path d="M-12 448 C174 336 318 222 342 38" fill="none" stroke="url(#brandGradient)" stroke-width="18" stroke-linecap="round" opacity="0.11"/>
  <path d="M1544 1594 C1320 1722 1240 1888 1338 2066" fill="none" stroke="url(#brandGradient)" stroke-width="22" stroke-linecap="round" opacity="0.11"/>

  <!-- Brand -->
  <image x="498" y="120" width="540" height="189" data-logo-source="../logo-v2/logo-horizontal-bilingual-light-wide.svg" href="../logo-v2/previews/logo-horizontal-bilingual-light-wide.png" xlink:href="../logo-v2/previews/logo-horizontal-bilingual-light-wide.png" preserveAspectRatio="xMidYMid meet"/>
  <line x1="638" y1="354" x2="898" y2="354" stroke="url(#brandGradient)" stroke-width="5" stroke-linecap="round"/>

  <!-- Heading -->
  <text class="cn ink" x="768" y="568" text-anchor="middle" font-size="112" font-weight="600" letter-spacing="10">新址小聚</text>

  <!-- Date card -->
  <g filter="url(#cardShadow)">
    <rect x="286" y="752" width="964" height="150" rx="48" fill="#FFFFFF" stroke="#DCEBDE" stroke-width="2"/>
  </g>
  <circle cx="366" cy="827" r="20" fill="url(#brandGradient)"/>
  <circle cx="1170" cy="827" r="7" fill="#278FF0" opacity="0.35"/>
  <text class="cn ink" x="768" y="845" text-anchor="middle" font-size="52" font-weight="600" letter-spacing="2">8月18日｜周二｜10:38</text>

  <!-- Invitation copy -->
  <text class="cn muted" x="768" y="1062" text-anchor="middle" font-size="38" font-weight="400">
    <tspan class="ink" x="768" dy="0" font-size="44" font-weight="500">我们搬新办公室啦</tspan>
    <tspan x="768" dy="86">本次为简约茶叙</tspan>
    <tspan x="768" dy="68">欢迎各位朋友抽空前来小坐交流</tspan>
  </text>

  <!-- Address card -->
  <g filter="url(#cardShadow)">
    <rect x="238" y="1320" width="1060" height="356" rx="64" fill="#FFFFFF"/>
  </g>
  <rect x="238" y="1320" width="12" height="356" rx="6" fill="url(#brandGradient)"/>
  <g transform="translate(366 1428)" fill="none" stroke="#278FF0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 38 C0 -10 74 -10 74 38 C74 90 37 122 37 122 C37 122 0 90 0 38 Z"/>
    <circle cx="37" cy="38" r="13" fill="#5DDA72" stroke="none"/>
  </g>
  <text class="cn ink" x="506" y="1427" font-size="36" font-weight="600" letter-spacing="6">新址</text>
  <line x1="506" y1="1460" x2="1134" y2="1460" stroke="#E8ECEF" stroke-width="2"/>
  <text class="cn ink" x="506" y="1540" font-size="42" font-weight="500">广州市天河区建工路8号</text>
  <text class="cn muted" x="506" y="1610" font-size="38" font-weight="400">海旺工业大厦七楼705</text>

  <!-- Tea detail -->
  <g transform="translate(657 1840)" fill="none" stroke="#278FF0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.62">
    <path d="M0 18 H170 V72 C170 118 136 148 85 148 C34 148 0 118 0 72 Z"/>
    <path d="M170 42 H206 C238 42 238 100 174 100"/>
    <path d="M30 172 H176"/>
    <path d="M54 -18 C34 -50 74 -72 54 -106"/>
    <path d="M104 -18 C84 -50 124 -72 104 -106"/>
  </g>
  <circle cx="599" cy="1908" r="8" fill="#5DDA72" opacity="0.58"/>
  <circle cx="944" cy="1908" r="8" fill="#278FF0" opacity="0.48"/>

</svg>
