<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-labelledby="title desc">
  <title id="title">GenGrowth balanced mark size test</title>
  <desc id="desc">The same balanced connected mark shown at exact 96, 48, 24, and 16 pixel sizes.</desc>
  <rect width="1100" height="420" fill="#F7F9FC"/>

  <defs>
    <symbol id="mark" viewBox="0 0 256 256">
      <path fill="#16A7B8" d="M92 28 C45 42 20 84 20 132 C20 192 70 232 129 222 C182 213 213 168 205 115 L153 115 L136 146 L178 146 C168 168 151 180 128 181 C91 183 61 155 60 118 C59 82 74 51 92 28Z"/>
      <path d="M82 49 L126 50 L72 88" fill="none" stroke="#16A7B8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#16A7B8">
        <circle cx="82" cy="49" r="9"/>
        <circle cx="126" cy="50" r="9"/>
        <circle cx="72" cy="88" r="9"/>
      </g>
      <path fill="#78C96B" d="M72 153 C91 130 112 119 139 113 C158 109 176 91 187 77 L175 65 L220 50 L212 96 L198 83 C183 106 160 126 136 132 C114 138 97 150 89 169 C81 165 76 159 72 153Z"/>
    </symbol>
  </defs>

  <text x="64" y="66" fill="#0F1B2D" font-family="Avenir Next, Arial, sans-serif" font-size="30" font-weight="600">GenGrowth · balanced refinement</text>
  <text x="64" y="101" fill="#607086" font-family="Avenir Next, Arial, sans-serif" font-size="17">Original structure retained · 3 nodes · 2 connections · 1 growth arrow</text>
  <rect x="48" y="134" width="1004" height="228" rx="20" fill="#FFFFFF" stroke="#DFE6EE"/>

  <g fill="#526073" font-family="Avenir Next, Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="248" y="190">96px</text>
    <text x="474" y="190">48px</text>
    <text x="654" y="190">24px</text>
    <text x="804" y="190">16px</text>
  </g>

  <use href="#mark" x="200" y="214" width="96" height="96"/>
  <use href="#mark" x="450" y="238" width="48" height="48"/>
  <use href="#mark" x="642" y="250" width="24" height="24"/>
  <use href="#mark" x="796" y="254" width="16" height="16"/>

  <line x1="896" y1="178" x2="896" y2="318" stroke="#DFE6EE"/>
  <text x="928" y="220" fill="#0F1B2D" font-family="Avenir Next, Arial, sans-serif" font-size="16" font-weight="600">Refinement</text>
  <text x="928" y="250" fill="#667487" font-family="Avenir Next, Arial, sans-serif" font-size="14">Removed one</text>
  <text x="928" y="273" fill="#667487" font-family="Avenir Next, Arial, sans-serif" font-size="14">diagonal only</text>
  <text x="928" y="303" fill="#168B99" font-family="Avenir Next, Arial, sans-serif" font-size="14" font-weight="600">Tech link retained</text>
</svg>
